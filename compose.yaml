name: grid-twin
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: twin
      POSTGRES_USER: twin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run python tools/configure.py}
      APP_PASSWORD: ${DB_APP_PASSWORD:?Run tools/configure.py}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deploy/postgres/init-app.sh:/docker-entrypoint-initdb.d/init-app.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U twin -d twin"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  init:
    build: .
    depends_on:
      db: {condition: service_healthy}
    environment: &appenv
      DATABASE_URL: postgresql+psycopg://dt_app:${DB_APP_PASSWORD}@db:5432/twin
    command: [grid-twin, init]
    volumes: [appdata:/app/data]
  api:
    build: .
    depends_on:
      init: {condition: service_completed_successfully}
    environment:
      <<: *appenv
      GOOGLE_MAPS_BROWSER_KEY: ${GOOGLE_MAPS_BROWSER_KEY:-}
      GOOGLE_MAPS_MAP_ID: ${GOOGLE_MAPS_MAP_ID:-DEMO_MAP_ID}
    ports: ["127.0.0.1:8000:8000"]
    volumes: [appdata:/app/data]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  worker:
    build: .
    depends_on:
      init: {condition: service_completed_successfully}
    environment: *appenv
    command: [grid-twin, worker]
    restart: unless-stopped
  broker-init:
    image: eclipse-mosquitto:2.1.2-alpine
    user: "0:0"
    environment: &mqttenv
      MQTT_WORKER_PASSWORD: ${MQTT_WORKER_PASSWORD:?Run tools/configure.py}
      MQTT_PUBLISH_PASSWORD: ${MQTT_PUBLISH_PASSWORD:?Run tools/configure.py}
    volumes: [mqttauth:/auth]
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        mosquitto_passwd -b -c /auth/passwd dt_worker "$$MQTT_WORKER_PASSWORD"
        mosquitto_passwd -b /auth/passwd dt_publisher "$$MQTT_PUBLISH_PASSWORD"
        chown 1883:1883 /auth/passwd
        chmod 640 /auth/passwd
  broker:
    image: eclipse-mosquitto:2.1.2-alpine
    depends_on:
      broker-init: {condition: service_completed_successfully}
    environment: *mqttenv
    volumes:
      - mqttauth:/mosquitto/auth:ro
      - mqttdata:/mosquitto/data
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./deploy/mosquitto/acl:/mosquitto/config/acl:ro
    ports: ["127.0.0.1:1883:1883"]
    restart: unless-stopped
  bridge:
    profiles: [streaming]
    build: .
    depends_on:
      init: {condition: service_completed_successfully}
      broker: {condition: service_started}
    environment:
      <<: *appenv
      MQTT_HOST: broker
      MQTT_USER: dt_worker
      MQTT_PASSWORD: ${MQTT_WORKER_PASSWORD}
      MQTT_PROJECT: demo
      MQTT_RUN_ID: stream_demo
    command: [grid-twin, mqtt]
    restart: unless-stopped
volumes:
  pgdata: {}
  appdata: {}
  mqttauth: {}
  mqttdata: {}
