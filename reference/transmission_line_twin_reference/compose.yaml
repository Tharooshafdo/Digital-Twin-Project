services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: twin_admin
      POSTGRES_DB: twin
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Run tools/configure.py}
      APP_PASSWORD: ${DB_APP_PASSWORD:?Run tools/configure.py}
      READER_PASSWORD: ${DB_READER_PASSWORD:?Run tools/configure.py}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deploy/postgres/init-roles.sh:/docker-entrypoint-initdb.d/init-roles.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U twin_admin -d twin"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  broker-init:
    image: eclipse-mosquitto:2.1.2-alpine
    user: "0:0"
    environment: &broker-passwords
      MQTT_PUBLISH_PASSWORD: ${MQTT_PUBLISH_PASSWORD:?Run tools/configure.py}
      MQTT_WORKER_PASSWORD: ${MQTT_WORKER_PASSWORD:?Run tools/configure.py}
      MQTT_VIEW_PASSWORD: ${MQTT_VIEW_PASSWORD:?Run tools/configure.py}
    volumes: ["mqttauth:/auth"]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mosquitto_passwd -b -c /auth/passwd dt_publisher "$$MQTT_PUBLISH_PASSWORD"
        mosquitto_passwd -b /auth/passwd dt_worker "$$MQTT_WORKER_PASSWORD"
        mosquitto_passwd -b /auth/passwd dt_viewer "$$MQTT_VIEW_PASSWORD"
        chown 1883:1883 /auth/passwd
        chmod 640 /auth/passwd
  broker:
    image: eclipse-mosquitto:2.1.2-alpine
    depends_on:
      broker-init: {condition: service_completed_successfully}
    environment: *broker-passwords
    volumes:
      - mqttauth:/mosquitto/auth:ro
      - mqttdata:/mosquitto/data
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./deploy/mosquitto/acl:/mosquitto/config/acl:ro
    ports: ["127.0.0.1:1883:1883"]
    healthcheck:
      test: [CMD-SHELL, 'mosquitto_pub -h localhost -u dt_publisher -P "$$MQTT_PUBLISH_PASSWORD" -q 1 -t dt/v1/health/ping -m ready']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  db-init:
    build: .
    depends_on:
      db: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql+psycopg://dt_app:${DB_APP_PASSWORD}@db:5432/twin
    command: ["python", "tools/init_db.py"]
  worker:
    build: .
    depends_on:
      db-init: {condition: service_completed_successfully}
      broker: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql+psycopg://dt_app:${DB_APP_PASSWORD}@db:5432/twin
      MQTT_HOST: broker
      MQTT_USER: dt_worker
      MQTT_PASSWORD: ${MQTT_WORKER_PASSWORD}
    command: ["tl-twin", "consume", "--run-id", "replay-v2", "--stream", "demo", "--mode", "replay"]
    restart: unless-stopped
  api:
    build: .
    depends_on:
      db-init: {condition: service_completed_successfully}
    environment:
      DATABASE_URL: postgresql+psycopg://dt_reader:${DB_READER_PASSWORD}@db:5432/twin
    command: ["uvicorn", "tl_twin.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  grafana:
    image: grafana/grafana:13.2.3
    depends_on:
      db-init: {condition: service_completed_successfully}
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run tools/configure.py}
      GF_USERS_ALLOW_SIGN_UP: "false"
      DB_READER_PASSWORD: ${DB_READER_PASSWORD}
    volumes:
      - grafanadata:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped
volumes:
  pgdata: {}
  mqttauth: {}
  mqttdata: {}
  grafanadata: {}
